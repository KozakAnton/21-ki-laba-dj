<!DOCTYPE html>
<html lang="en">
<{% extends 'labs/base.html' %}

{% block content %}
<div class="product-detail">
    <div class="product-image">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    </div>

    <div class="product-info-side">
        <span class="product-code">Код товару: {{ product.id }}49430</span>
        <h1>{{ product.name|upper }}</h1>
        <p class="detail-price">{{ product.price }} ₴</p>

        <div class="size-selector">
            <p>Виберіть розмір:</p>
            <div class="size-options">
                {% for size in product.get_sizes_list %}
                    <input type="radio" name="size" id="size-{{ size }}" value="{{ size }}" class="size-radio">
                    <label for="size-{{ size }}" class="size-label">{{ size }}</label>
                {% endfor %}
            </div>
        </div>

        <button class="btn-add-to-cart">Додати у кошик</button>

        <div class="product-description">
            <p>{{ product.description }}</p>
        </div>
    </div>
</div>
{% endblock %}
</html>
