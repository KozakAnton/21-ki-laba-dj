<!DOCTYPE html>
<html lang="en">
{% extends 'labs/base.html' %}

{% block content %}
<div class="container" style="padding: 40px 10%; background-color: #000;">
    <h1 style="color: #a855f7; text-transform: uppercase; letter-spacing: 3px; border-left: 4px solid #a855f7; padding-left: 15px; margin-bottom: 40px;">
        {{ category.name }}
    </h1>

    <div class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;">
        {% for product in products %}
        <div class="product-card" style="background: #111; border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: 0.3s;">
            <a href="{% url 'product_detail' product.id %}" style="text-decoration: none; color: inherit;">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" style="width: 100%; height: 350px; object-fit: cover;">
                {% else %}
                    <div style="width: 100%; height: 350px; background: #222; display: flex; align-items: center; justify-content: center;">
                        <span style="color: #444;">Фото відсутнє</span>
                    </div>
                {% endif %}

                <div style="padding: 20px; text-align: center;">
                    <h3 style="margin: 0 0 10px 0; font-size: 1.2rem;">{{ product.name }}</h3>
                    <p style="color: #a855f7; font-weight: bold; font-size: 1.3rem; margin: 0;">{{ product.price }} грн</p>
                </div>
            </a>
        </div>
        {% empty %}
        <p style="color: #666; text-align: center; grid-column: 1/-1;">У цій категорії поки немає товарів.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
</html>
